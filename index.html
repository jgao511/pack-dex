      window.__packdexPerformance = window.__packdexPerformance || {};

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const state = window.__packdexPerformance;
        const atMs = Number(performance.now().toFixed(1));
        state.htmlShellReady = atMs;
        state.timeline = [...(state.timeline || []), { name: "htmlShellReady", atMs }];
        performance.mark?.("packdex-html-shell-ready");
      })();
    </script>
    <script>
      (() => {
        const state = window.__packdexPerformance;
        const atMs = Number(performance.now().toFixed(1));
        state.mainRequestStart = atMs;
        state.timeline = [...(state.timeline || []), { name: "mainRequestStart", atMs }];
        performance.mark?.("packdex-main-request-start");
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
